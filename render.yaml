services:
  - type: web
    name: studentsuccess
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_RESET_ON_DEPLOY
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true