<label for="username">Choose a username</label><input id="username" name="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9][A-Za-z0-9_\-]{2,29}" value="{{ request.form.get('username','') }}" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="username-help" required>
<small id="username-help">3–30 letters, numbers, underscores or hyphens. Use a nickname, not your full name.</small>
<label for="password">Choose a password</label><input id="password" name="password" type="password" minlength="15" maxlength="128" autocomplete="new-password" aria-describedby="password-help" required><small id="password-help">At least 15 characters. Try a few unrelated words.</small>
<button type="button" class="password-toggle" data-password-toggle="password" aria-pressed="false">Show password</button>
<label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirm_password" type="password" minlength="15" maxlength="128" autocomplete="new-password" required>
