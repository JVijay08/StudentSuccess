<link rel="stylesheet" href="{{ url_for('static', filename='css/studio.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/accessibility.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
<link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
<script>
  {# Older accounts may have saved "system" before automatic dark mode was ready. #}
  document.documentElement.dataset.theme = {{ ('light' if ui_settings.theme == 'system' else ui_settings.theme)|tojson }};
  document.documentElement.dataset.textScale = {{ ui_settings.text_scale|tojson }};
  document.documentElement.dataset.spacing = {{ ('comfortable' if ui_settings.comfortable_spacing else 'standard')|tojson }};
  document.documentElement.dataset.motion = {{ ('reduced' if ui_settings.reduce_motion else 'standard')|tojson }};
  document.documentElement.dataset.font = {{ ui_settings.font_choice|tojson }};
  document.documentElement.dataset.density = {{ ui_settings.card_density|tojson }};
</script>
