{% if seo %}
<meta name="description" content="{{ seo.description }}">
<link rel="canonical" href="{{ seo.canonical }}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta property="og:site_name" content="StudentSuccess">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ seo.title }}">
<meta property="og:description" content="{{ seo.description }}">
<meta property="og:url" content="{{ seo.canonical }}">
<meta property="og:image" content="{{ seo.image }}">
<meta property="og:image:alt" content="StudentSuccess — Plan less. Start sooner.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo.title }}">
<meta name="twitter:description" content="{{ seo.description }}">
<meta name="twitter:image" content="{{ seo.image }}">
<meta name="twitter:image:alt" content="StudentSuccess — Plan less. Start sooner.">
{% if seo.schema %}<script type="application/ld+json">{{ seo.schema|tojson }}</script>{% endif %}
{% if config.GOOGLE_SITE_VERIFICATION %}<meta name="google-site-verification" content="{{ config.GOOGLE_SITE_VERIFICATION }}">{% endif %}
{% endif %}
