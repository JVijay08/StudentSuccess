<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#081225">
  <title>Edit task | StudentSuccess</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tasks.css') }}">
  {% include '_accessibility_head.html' %}
</head>
<body>
  {% include '_accessibility_body.html' %}
  <main id="main-content">
    <header>
      <div>
        <p class="eyebrow">STUDENTSUCCESS</p>
        <h1>Edit task</h1>
        <p>Update the details below and save your changes.</p>
      </div>
      <a href="{{ url_for('tasks.tasks') }}">Back to tasks</a>
    </header>

    <section class="panel">
      <h2>{{ task.title }}</h2>
      {% if errors %}
        <div class="errors" role="alert">
          <ul>
            {% for error in errors %}<li>{{ error }}</li>{% endfor %}
          </ul>
        </div>
      {% endif %}
      <form method="post" action="{{ url_for('tasks.edit_task', task_id=task.id) }}">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" maxlength="160" value="{{ form_data.get('title', '') }}" required>
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" maxlength="80" value="{{ form_data.get('subject', '') }}">
        </div>
        <div class="form-group">
          <label for="task_type">Task type</label>
          <input type="text" id="task_type" name="task_type" maxlength="40" placeholder="Homework, project, exam..." value="{{ form_data.get('task_type', '') }}">
        </div>
        <div class="form-group">
          <label for="due_at">Due date and time</label>
          <input type="datetime-local" id="due_at" name="due_at" value="{{ form_data.get('due_at', '') }}" required>
        </div>
        <div class="form-group">
          <label for="planned_start_at">Planned start</label>
          <input type="datetime-local" id="planned_start_at" name="planned_start_at" value="{{ form_data.get('planned_start_at', '') }}">
        </div>
        <div class="form-group">
          <label for="estimated_minutes">Estimated minutes</label>
          <input type="number" id="estimated_minutes" name="estimated_minutes" min="1" max="1440" value="{{ form_data.get('estimated_minutes', '') }}" required>
        </div>
        <div class="form-group">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty" name="difficulty" required>
            {% for option in ["low", "medium", "high"] %}
              <option value="{{ option }}" {% if form_data.get('difficulty', 'medium') == option %}selected{% endif %}>{{ option|title }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="interest_level">Interest level</label>
          <select id="interest_level" name="interest_level" required>
            {% for option in ["low", "medium", "high"] %}
              <option value="{{ option }}" {% if form_data.get('interest_level', 'medium') == option %}selected{% endif %}>{{ option|title }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="recurrence_rule">Repeats</label>
          <select id="recurrence_rule" name="recurrence_rule">
            <option value="" {% if form_data.get('recurrence_rule', '') == '' %}selected{% endif %}>None</option>
            <option value="daily" {% if form_data.get('recurrence_rule') == 'daily' %}selected{% endif %}>Daily</option>
            <option value="weekly" {% if form_data.get('recurrence_rule') == 'weekly' %}selected{% endif %}>Weekly</option>
            <option value="biweekly" {% if form_data.get('recurrence_rule') == 'biweekly' %}selected{% endif %}>Every 2 weeks</option>
            <option value="monthly" {% if form_data.get('recurrence_rule') == 'monthly' %}selected{% endif %}>Monthly</option>
          </select>
          <label class="inline-check"><input type="checkbox" name="reminder_enabled" {% if form_data.get('reminder_enabled', true) %}checked{% endif %}> Include this task in reminders</label>
        </div>
        <div class="actions">
          <button type="submit">Save changes</button>
          <a href="{{ url_for('tasks.tasks') }}">Cancel</a>
        </div>
      </form>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/accessibility.js') }}"></script>
</body>
</html>
